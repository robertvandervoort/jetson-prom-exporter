# jtop hard-codes /run/jtop.sock and recreates it on every start. A container
# that bind-mounts that file keeps the old inode and can never reconnect, so
# publish a hard link in /run/jtop/ and let containers mount the directory.
[Service]
ExecStartPre=/bin/mkdir -p /run/jtop
ExecStartPre=/bin/rm -f /run/jtop.sock /run/jtop/jtop.sock
ExecStartPost=/bin/sh -c 'for _ in $$(seq 1 250); do [ -S /run/jtop.sock ] && exec ln -f /run/jtop.sock /run/jtop/jtop.sock; sleep 0.1; done; exit 1'
ExecStopPost=/bin/rm -f /run/jtop/jtop.sock
